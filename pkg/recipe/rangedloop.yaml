name: rangedloop
description: "satellite-ranged loop service"
add:
  - name: satellite-rangedloop
    label:
      - storj
      - core
    image: ghcr.io/storj/up/storj:1.158.2
    command:
      - satellite
      - run
      - ranged-loop
      - --defaults=dev
      - '--identity-dir={{ Environment .This "identityDir" }}'
    persistence:
      - /storj/.local/share/storj
    config:
      STORJ_DATABASE: '{{ Environment "db" "main" }}'
      STORJ_METAINFO_DATABASE_URL: '{{ Environment "db" "metainfo" }}'
      STORJ_DEBUG_ADDR: '{{ Host .This "listen" }}:{{ Port .This "debug"}}'
      STORJ_LOG_LEVEL: debug
      STORJ_METRICS_APP_SUFFIX: sim

      STORJ_VERSION_SERVER_ADDRESS: 'http://{{ Host "versioncontrol" "external"}}:{{ Port "versioncontrol" "public"}}'
      # storj >=1.158: ranged-loop requires the job-queue server (jobq service in core.yaml).
      STORJ_JOB_QUEUE_SERVER_NODE_URL: '{{ Environment "jobq" "identity" }}@jobq:15781'
      STORJ_JOB_QUEUE_TLS_USE_PEER_CA_WHITELIST: "false"
      STORJ_JOB_QUEUE_TLS_EXTENSIONS_REVOCATION: "false"
    environment:
      STORJ_WAIT_FOR_SATELLITE: 1
      STORJ_DEFAULTS: dev
      STORJ_IDENTITY_DIR: '{{ Environment .This "identityDir" }}'
